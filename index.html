<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dr. Sherine Braganza — Choose Version</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #0b1220 0%, #1a2847 100%);
      color: #e5e7eb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      text-align: center;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
      color: #fff;
    }

    .subtitle {
      font-size: 1.1em;
      color: #9ca3af;
      margin-bottom: 50px;
    }

    .version-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 30px;
    }

    .version-card {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(96, 165, 250, 0.2);
      border-radius: 12px;
      padding: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .version-card:hover {
      border-color: #60a5fa;
      background: rgba(96, 165, 250, 0.1);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(96, 165, 250, 0.15);
    }

    .version-card h2 {
      font-size: 1.4em;
      color: #60a5fa;
      margin-bottom: 8px;
    }

    .version-card p {
      font-size: 0.95em;
      color: #d1d5db;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      .version-selector {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 1.8em;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Dr. Sherine Braganza</h1>
    <p class="subtitle">Choose your version</p>

    <div class="version-selector">
      <a href="versions/current/" class="version-card">
        <h2>Clinical</h2>
        <p>Vitreoretinal Surgeon • ROP • AI in Ophthalmology</p>
      </a>

      <a href="versions/corporate/" class="version-card">
        <h2>Corporate</h2>
        <p>Healthcare AI • Product Strategy • Diagnostics</p>
      </a>
    </div>
  </div>
</body>

</html>
